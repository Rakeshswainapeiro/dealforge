# Optional override: run ObjectIO alongside DealForge for local dev.
#
#   # 1. start ObjectIO and grab the admin keys it prints on first boot
#   docker compose -f docker-compose.yml -f docker-compose.objectio.yml up -d objectio
#   docker compose -f docker-compose.yml -f docker-compose.objectio.yml logs objectio \
#     | grep -E "Admin (access|secret) key"
#   #    ...or read them from the volume:  /data/meta/admin-creds.env
#
#   # 2. put the keys in .env
#   #    S3_ACCESS_KEY_ID=AKIA...
#   #    S3_SECRET_ACCESS_KEY=...
#
#   # 3. start the full stack (app now stores uploads in ObjectIO)
#   docker compose -f docker-compose.yml -f docker-compose.objectio.yml up -d
#
# ObjectIO is S3-compatible; the same S3_* settings point at MinIO / R2 / AWS.
services:
  objectio:
    build:
      context: ./deploy/objectio
    container_name: dealforge-objectio
    ports:
      - "34002:9000" # ObjectIO S3 API + console
    volumes:
      - objectio-data:/data
    restart: unless-stopped

  app:
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://objectio:9000}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

volumes:
  objectio-data:
