services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealforge
      POSTGRES_PASSWORD: dealforge
      POSTGRES_DB: dealforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealforge -d dealforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "127.0.0.1:34000:3001"
    environment:
      PORT: "3001"
      # The image defaults to production (strict startup checks). This compose
      # file is the LOCAL developer stack, so it runs as development.
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://dealforge:dealforge@db:5432/dealforge
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:34000}
      # Self-call target for server-side notification transport (email/SMS).
      # Broad API ceiling; tunable so a full integration run is not throttled.
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-600}
      # Set to 1 to disable every limiter (app + Better Auth) for integration runs.
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-0}
      # Seed the UAT demo pipeline (idempotent, tagged demo:true) for local UI walks.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-0}
      # Seed profile; overrides SEED_DEMO_DATA when set. base = users, org tree and
      # configuration only (no opportunities); mvp = base + sample pipeline;
      # off = nothing. Empty = fall back to SEED_DEMO_DATA.
      SEED_PROFILE: ${SEED_PROFILE:-}
      # Better Auth session secret (required in production).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dealforge-local-dev-secret-change-me-4d1f8c9e0b2a}
      # Default password seeded for app users so they can sign in.
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-DealForge!2026}
      # Extra browser origins trusted for session creation (comma-separated).
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
      # Extra browser origins allowed by CORS (comma-separated).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # LOCAL TESTING ONLY: lets the integration suite act as seeded users via
      # x-user-id / x-user-email headers. Refused in production.
      AUTH_ALLOW_HEADER_IDENTITY: ${AUTH_ALLOW_HEADER_IDENTITY:-0}
      # Deployment-time feature/menu visibility (comma list of page keys; '-' disables).
      FEATURE_FLAGS: ${FEATURE_FLAGS:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-DealForge <no-reply@dealforge.local>}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-dealforge}
      S3_PREFIX: ${S3_PREFIX:-dealforge}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      CONESHARE_BASE_URL: ${CONESHARE_BASE_URL:-}
      CONESHARE_API_KEY: ${CONESHARE_API_KEY:-}
      CONESHARE_API_PATH: ${CONESHARE_API_PATH:-/api/v1}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
