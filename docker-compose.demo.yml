# ---------------------------------------------------------------------------
# Clean UAT demo stack for capturing screenshot evidence.
#
# Runs the same app image on isolated ports and a fresh database so the
# screenshots are not polluted by test debris in the developer stack. The
# SEED_PROFILE=mvp profile gives every persona a populated pipeline from the
# deterministic sample set (docs/sample-data/MVP_Sample_Data_Map.md).
#
#   docker compose -p dealforge-demo -f docker-compose.demo.yml up -d --build
#   open http://localhost:34010
# ---------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealforge
      POSTGRES_PASSWORD: dealforge
      POSTGRES_DB: dealforge
    volumes:
      - pgdata_demo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealforge -d dealforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "34010:3001"
    environment:
      PORT: "3001"
      # Local demo stack: development mode (the image defaults to production).
      NODE_ENV: development
      DATABASE_URL: postgres://dealforge:dealforge@db:5432/dealforge
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: http://localhost:34010
      API_RATE_LIMIT_MAX: "600"
      RATE_LIMIT_DISABLED: "0"
      # W1-11/W1-12: load the deterministic MVP sample set (base reference data
      # + the fixtures in docs/sample-data/MVP_Sample_Data_Map.md). SEED_CLEAN=1
      # wipes the seed set before loading so a demo start is always reproducible.
      SEED_PROFILE: "mvp"
      SEED_CLEAN: "0"
      BETTER_AUTH_SECRET: dealforge-demo-secret-4d1f8c9e0b2a
      DEFAULT_USER_PASSWORD: DealForge!2026
      AUTH_TRUSTED_ORIGINS: http://localhost:34010
      FEATURE_FLAGS: ""
    volumes:
      - uploads_demo:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_demo:
  uploads_demo:
